// File: android/build.gradle  (project‑level)

buildscript {
    ext.kotlin_version = "2.2.20"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.11.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            // إجبار appcompat للإصدار 1.6.1
            force "androidx.appcompat:appcompat:1.6.1"
            force "androidx.appcompat:appcompat-resources:1.6.1"

            eachDependency { details ->
                if (details.requested.group == 'androidx.appcompat') {
                    details.useVersion "1.6.1"
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// >> GIT_ALL_IN_ONE:startApi
tasks.register('startApi', Exec) {
    workingDir = rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.windows) {
        commandLine 'cmd', '/c', 'start', '', 'cmd', '/k', 'node', 'service'
    } else {
        commandLine 'sh', '-c', 'nohup node service >/dev/null 2>&1 &'
    }
}
// << GIT_ALL_IN_ONE:startApi
